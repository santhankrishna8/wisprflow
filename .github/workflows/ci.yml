name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Syntax-check the main process
        run: for f in electron/*.cjs scripts/*.cjs; do node --check "$f"; done
      - run: npm test
      - run: npm run build:renderer
