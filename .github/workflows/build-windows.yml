name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Smoke-test on-device transcription in the packaged app
        run: node scripts/smoke-local-whisper.cjs release/win-unpacked/resources/whisper
      - uses: actions/upload-artifact@v4
        with:
          name: WisprFlow-Windows-installer
          path: release/*.exe
