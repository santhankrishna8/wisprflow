name: Build Windows installer

# Run manually for a test build, or push a tag like v0.2.0 to publish a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to publish releases on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: npm version $("${{ github.ref_name }}".TrimStart("v")) --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Smoke-test on-device transcription in the packaged app
        run: node scripts/smoke-local-whisper.cjs release/win-unpacked/resources/whisper
      - uses: actions/upload-artifact@v4
        with:
          name: WisprFlow-Windows-installer
          path: release/*.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/WisprFlow-Setup.exe
          generate_release_notes: true
          body: |
            ## Install
            1. Download **WisprFlow-Setup.exe** below.
            2. If Windows shows "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed yet).
            3. In setup, choose **On this PC** and download the **Base** model to dictate offline for free.
